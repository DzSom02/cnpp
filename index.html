<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Page Container</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css"> <!-- Combined CSS -->
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">My App</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="#" onclick="loadPage('version1/main.html')">Page 1</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" onclick="loadPage('version2/main.html')">Page 2</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" onclick="loadPage('version3/main.html')">Page 3</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Dynamic Content Section -->
  <div class="container my-4">
    <div id="content">
      <!-- Dynamic content will be loaded here -->
      <p>Welcome! Click on a menu item to load a page.</p>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-light text-center py-3">
    <p>&copy; 2025 My App. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="load.js"></script>
</body>
</html>
